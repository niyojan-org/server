info:
  name: Get Notification Stats
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/notifications/stats"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Get notification statistics for the authenticated user

  Returns:
  - total: Total notifications
  - unread: Unread count
  - by_type: Count by notification type
  - by_priority: Count by priority
