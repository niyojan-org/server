info:
  name: Register Push Token
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}/api/notifications/push-tokens"
  body:
    type: json
    data: |-
      {
        "subscription": "{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/...\",\"keys\":{\"p256dh\":\"...\",\"auth\":\"...\"}}",
        "deviceInfo": {
          "userAgent": "Mozilla/5.0...",
          "platform": "Linux x86_64"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Register a Web Push subscription token
  
  Body Parameters:
  - subscription: JSON string of the PushSubscription object
  - deviceInfo: Object with userAgent and platform
  
  Note: The subscription is obtained from the browser's Push API
