info:
  name: Archive Notification
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/api/notifications/{{notificationId}}/archive"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

vars:
  notificationId: your-notification-uuid-here

docs: |
  Archive a notification (removes it from the user's inbox)
  
  Path Parameters:
  - notificationId: UUID of the notification to archive
