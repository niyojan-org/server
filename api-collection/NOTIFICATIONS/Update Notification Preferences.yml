info:
  name: Update Notification Preferences
  type: http
  seq: 7

http:
  method: PUT
  url: "{{url}}/notifications/preferences"
  body:
    type: json
    data: |-
      {
        "push_enabled": true,
        "in_app_enabled": false,
        "preferences": {
          "event_reminder": {
            "email": false,
            "push": true,
            "in_app": true
          },
          "organization_verified": {
            "email": true,
            "push": true,
            "in_app": true
          }
        },
        "quiet_hours_enabled": true,
        "quiet_hours_start": "22:00",
        "quiet_hours_end": "08:00",
        "timezone": "Asia/Kolkata"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Update user's notification preferences

  Body Parameters:
  - email_enabled: Enable/disable email notifications
  - push_enabled: Enable/disable push notifications
  - in_app_enabled: Enable/disable in-app notifications
  - preferences: Per-type preferences object
  - quiet_hours_enabled: Enable quiet hours
  - quiet_hours_start: Start time (HH:MM format)
  - quiet_hours_end: End time (HH:MM format)
  - timezone: User timezone
