info:
  name: Deactivate Push Token
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{url}}/notifications/push-tokens"
  body:
    type: json
    data: |-
      {
        "token": "{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/...\",\"keys\":{\"p256dh\":\"...\",\"auth\":\"...\"}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Deactivate a push token (unsubscribe from push notifications)

  Body Parameters:
  - token: The push token to deactivate
