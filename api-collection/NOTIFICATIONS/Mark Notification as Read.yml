info:
  name: Mark Notification as Read
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/notifications/read"
  body:
    type: json
    data: |-
      {
        "notificationId": "your-notification-uuid-here"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Mark a specific notification as read
  
  Body Parameters:
  - notificationId: UUID of the notification to mark as read
