info:
  name: Delete Resource
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{resource_url}}/{{resourceId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Delete a resource (soft delete by default)
  
  Query Parameters:
  - permanent: Set to 'true' for hard delete (removes from database and cloud storage)
  
  Soft delete (default): Sets status to 'archived', can be restored later
  Hard delete: Permanently removes resource and file from cloud storage
  
  Examples:
  - Soft delete: DELETE /resources/123
  - Hard delete: DELETE /resources/123?permanent=true
