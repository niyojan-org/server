info:
  name: Batch Delete Resources
  type: http
  seq: 8

http:
  method: POST
  url: "{{resource_url}}/batch-delete"
  body:
    type: json
    data: |-
      {
        "resourceIds": ["{{resourceId1}}", "{{resourceId2}}"],
        "permanent": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Delete multiple resources in a single request
  
  Request Body:
  - resourceIds: Array of resource IDs to delete (required, max 50)
  - permanent: true for hard delete, false for soft delete (optional, default: false)
  
  Returns:
  - deletedCount: Number of successfully deleted resources
  - errors: Array of any errors encountered during deletion
