info:
  name: Get Event Resources
  type: http
  seq: 12

http:
  method: GET
  url: "{{resource_url}}/event/{{eventId}}?limit=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Get all resources for a specific event
  
  Query Parameters:
  - page: Page number (default: 1)
  - limit: Items per page (default: 20, max: 100)
  - type: Filter by resource type (event-banner, flyer, poster, etc.)
  - status: Filter by status (active, inactive, archived)
  - search: Full-text search
  - sort: Sort field (e.g., -priority, -createdAt)
