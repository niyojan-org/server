info:
  name: " Validate Domain Purpose"
  type: http
  seq: 6

http:
  method: GET
  url: "{{url}}/domains/validate?domain=http://localhost:3000&purpose=cors&environment=development"
  params:
    - name: domain
      value: http://localhost:3000
      type: query
    - name: purpose
      value: cors
      type: query
    - name: environment
      value: development
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
