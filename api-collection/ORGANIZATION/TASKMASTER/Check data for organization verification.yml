docs: |
  # Check Organization Data Validity

  Validates if organization has all required data before raising verification request.

  ## Endpoint
  - **Method**: GET
  - **URL**: `/admin/:id/check-validity`
  - **Auth**: Required (Organization Owner/Admin)

  ## Path Parameters
  - `id` (string, required): Organization ID

  ## Response
  Returns validation status for organization and bank data with list of missing fields if any.
