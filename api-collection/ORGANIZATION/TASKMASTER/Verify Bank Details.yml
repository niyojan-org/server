docs: |
  # Verify Bank Details

  Approves bank account verification and grants paid event permissions.

  ## Endpoint
  - **Method**: POST
  - **URL**: `/taskmaster/:id/verify-bank`
  - **Auth**: Required (Taskmaster)

  ## Path Parameters
  - `id` (string, required): Organization ID

  ## Request Body
  ```json
  {
    "allowsPaidEvents": true
  }
  ```

  ### Body Parameters
  - `allowsPaidEvents` (boolean, required): Whether to allow paid events
    - `true`: Organization can create paid/ticketed events
    - `false`: Bank verified but paid events restricted

  ## Prerequisites
  - Bank verification request must be pending
  - Bank details must not already be verified

  ## Response

  ### Success (200 OK)
  ```json
  {
    "success": true,
    "message": "Bank details verified successfully",
    "data": {
      "_id": "69a2f93b33a5da5c1ffdbe92",
      "bankDetails": {
        "accountHolderName": "Tech Innovators Inc",
        "bankName": "Bank of America",
        "accountNumber": "****7890",
        "ifscCode": "BOFA0001234",
        "verified": true,
        "verifiedAt": "2026-03-02T14:00:00.000Z",
        "verifiedBy": "69a2f93b33a5da5c1ffdbe95",
        "reqForVerification": false
      },
      "allowsPaidEvents": true
    }
  }
  ```

  ### Error - Already Verified (400 Bad Request)
  ```json
  {
    "success": false,
    "message": "Bank details already verified"
  }
  ```

  ### Error - No Pending Request (400 Bad Request)
  ```json
  {
    "success": false,
    "message": "No bank verification request pending"
  }
  ```

  ## What Happens
  1. `bankDetails.verified` set to `true`
  2. `bankDetails.verifiedAt` timestamp recorded
  3. `bankDetails.verifiedBy` set to taskmaster ID
  4. `bankDetails.reqForVerification` set to `false`
  5. `allowsPaidEvents` set based on request
  6. `bankDetails.rejectionReason` cleared
  7. Email notification sent
  8. Audit log created

  ## Use Cases

  ### Full Approval
  ```json
  {
    "allowsPaidEvents": true
  }
  ```
  Organization can immediately create paid events.

  ### Conditional Approval
  ```json
  {
    "allowsPaidEvents": false
  }
  ```
  Bank verified but paid events need additional approval.

  ## Permissions Granted
  - Bank account verified (builds trust)
  - Can create paid/ticketed events (if `allowsPaidEvents: true`)
  - Can receive payments through platform
  - Financial transactions enabled

  ## Verification Checklist
  - [ ] Account holder name matches organization name
  - [ ] Bank name is valid and recognized
  - [ ] Account number format is correct
  - [ ] IFSC code is valid
  - [ ] Branch details are accurate
  - [ ] UPI ID verified (if provided)
