  # Reject Organization Verification

  Rejects organization verification with detailed reason.

  ## Endpoint
  - **Method**: POST
  - **URL**: `/taskmaster/:id/reject`
  - **Auth**: Required (Taskmaster)

  ## Request Body
  ```json
  {
    "reason": "Clear reason for rejection"
  }
  ```

  ## Body Parameters
  - `reason` (string, required): Detailed reason for rejection (min 10 characters)
