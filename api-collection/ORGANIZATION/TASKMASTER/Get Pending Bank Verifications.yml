docs: |
  # Get Pending Bank Verifications

  Retrieves list of organizations with bank details waiting for verification.

  ## Endpoint
  - **Method**: GET
  - **URL**: `/taskmaster/pending-bank-verifications`
  - **Auth**: Required (Taskmaster)

  ## Query Parameters
  - `page` (number, optional): Page number (default: 1)
  - `limit` (number, optional): Items per page (default: 10)

  ## Response

  ### Success (200 OK)
  ```json
  {
    "success": true,
    "message": "Pending bank verifications retrieved successfully",
    "data": {
      "organizations": [
        {
          "_id": "69a2f93b33a5da5c1ffdbe92",
          "name": "Tech Innovators Inc",
          "bankDetails": {
            "accountHolderName": "Tech Innovators Inc",
            "bankName": "Bank of America",
            "branchName": "San Francisco Main Branch",
            "accountNumber": "****7890",
            "ifscCode": "BOFA0001234",
            "verified": false,
            "reqForVerification": true,
            "verificationRaisedAt": "2026-03-01T11:00:00.000Z"
          }
        }
      ],
      "pagination": {
        "page": 1,
        "limit": 10,
        "total": 15,
        "pages": 2
      }
    }
  }
  ```

  ## Use Cases
  1. Taskmasters review bank verification queue
  2. Verify bank account details submitted by organizations
  3. Approve organizations for paid events

  ## Filter Criteria
  Shows organizations where:
  - `bankDetails.verified: false`
  - `bankDetails.reqForVerification: true`
  - Sorted by `bankDetails.verificationRaisedAt` (oldest first)

  ## Security Note
  Account numbers are partially masked for security
