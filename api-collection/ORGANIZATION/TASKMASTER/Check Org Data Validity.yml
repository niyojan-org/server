docs: |
  # Check Organization Data Validity

  Validates if the organization has all required data before raising a verification request.

  ## Endpoint
  - **Method**: GET
  - **URL**: `/admin/:id/check-validity`
  - **Auth**: Required (Organization Owner/Admin)

  ## Path Parameters
  - `id` (string, required): Organization ID

  ## Response

  ### Success (200 OK)
  ```json
  {
    "success": true,
    "message": "Organization data is valid and ready for verification",
    "data": {
      "orgDataValid": true,
      "bankDataValid": true,
      "missingOrgData": [],
      "missingBankData": []
    }
  }
  ```

  ### Incomplete Data (400 Bad Request)
  ```json
  {
    "success": false,
    "message": "Missing required data",
    "data": {
      "orgDataValid": false,
      "bankDataValid": false,
      "missingOrgData": ["email", "phone", "address.city"],
      "missingBankData": ["accountNumber", "ifscCode"]
    }
  }
  ```

  ## Validation Checks

  ### Organization Data:
  - name
  - email
  - phone
  - category
  - address (city, state, country)
  - supportContact (name, email, phone)

  ### Bank Data:
  - accountHolderName
  - bankName
  - accountNumber
  - ifscCode

  ## Use Cases
  1. Pre-verification check before raising verification request
  2. Identify missing required fields
  3. Ensure data completeness for smooth verification process
