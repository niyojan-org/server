docs: |
  # Verify Organization

  Approves organization verification and grants event creation permissions.

  ## Endpoint
  - **Method**: POST
  - **URL**: `/taskmaster/:id/verify`
  - **Auth**: Required (Taskmaster)

  ## Request Body
  ```json
  {
    "allowsEventCreation": true
  }
  ```

  ## Body Parameters
  - `allowsEventCreation` (boolean, required): Allow organization to create events
