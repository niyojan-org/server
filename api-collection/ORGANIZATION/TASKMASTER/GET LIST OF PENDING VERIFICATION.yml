info:
  name: GET LIST OF PENDING VERIFICATION
  type: http
  seq: 1

http:
  method: GET
  url: "{{org_tm_url}}/verifications/pending/organizations"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Get Pending Organization Verifications

  Retrieves paginated list of organizations awaiting verification.

  ## Endpoint
  - **Method**: GET
  - **URL**: `/taskmaster/pending-verifications`
  - **Auth**: Required (Taskmaster)

  ## Query Parameters
  - `page` (number, optional): Page number (default: 1)
  - `limit` (number, optional): Items per page (default: 10)

  ## Response
  Returns list of organizations with `reqForVerification: true` and `verified: false`.
