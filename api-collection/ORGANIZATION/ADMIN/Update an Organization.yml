info:
  name: Update an Organization
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{org_url}}/admin/update"
  body:
    type: json
    data: |-
      {
        "description": "A nonprofit organization dedicated to using technology for social impact",
        "website": "https://techforgood.org",
        "address": {
          "locality" : "Karon",
          "street": "123 Main Street",
          "city": "San Francisco",
          "state": "California",
          "country": "USA",
          "zipCode": "94102"
        },
        "socialMedia": {
          "facebook": "https://facebook.com/techforgood",
          "twitter": "https://twitter.com/techforgood",
          "linkedin": "https://linkedin.com/company/techforgood",
          "instagram": "https://instagram.com/techforgood"
        },
        "logo": "https://cdn.example.com/logos/techforgood.png",
        "coverImage": "https://cdn.example.com/covers/techforgood.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Updates organization details
